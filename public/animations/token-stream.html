<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Stream — SLM Coder</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181F;--paper:#ffffff;--paper-dim:#ffffff;--paper-line:rgba(20,24,31,.10);
    --paper-ink:#2A2620;--verm:#E0511D;--verm-soft:rgba(224,81,29,.14);
    --text:#D9D4C6;--muted:#8C92A2;--hairline:rgba(217,212,198,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:'IBM Plex Serif',Georgia,serif;-webkit-font-smoothing:antialiased}
  .wrap{height:100%;display:flex;flex-direction:column;padding:14px}
  .panel{background:var(--paper);color:var(--paper-ink);border-radius:3px;flex:1;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 0 0 1px rgba(20,24,31,.18)}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--paper-line);flex-shrink:0}
  .panel-title{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#5d564a}
  .readout{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;padding:4px 10px;border-radius:2px;border:1px solid rgba(20,24,31,.25)}
  .readout.ok{color:#4a6b3f;border-color:rgba(74,107,63,.45)}
  .panel-body{padding:14px 16px;overflow-y:auto;flex:1}
  .note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6e675a;line-height:1.5;margin-bottom:10px}

  .cr-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:0}
  .cr-card{
    text-align:left;font-family:'IBM Plex Serif',serif;font-size:12px;line-height:1.5;
    text-transform:none;letter-spacing:0;padding:12px;cursor:pointer;
    border:1px solid rgba(20,24,31,.25);background:rgba(255,255,255,.3);color:var(--paper-ink);
    border-radius:2px;transition:all .2s;
  }
  .cr-card:hover{background:rgba(255,255,255,.6)}
  .cr-card.sel{border-color:var(--verm);box-shadow:inset 0 0 0 1px var(--verm);background:rgba(255,255,255,.6)}
  .cr-card .cid{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--verm);display:block;margin-bottom:6px}

  .tok-stream{min-height:48px;margin-top:12px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
  .tok{
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 6px;border-radius:2px;
    background:rgba(20,24,31,.07);border:1px solid rgba(20,24,31,.18);
    opacity:0;transform:translateY(5px);transition:opacity .25s,transform .25s;
  }
  .tok.in{opacity:1;transform:none}

  .bars{margin-top:14px;display:grid;gap:7px}
  .bar-row{display:grid;grid-template-columns:180px 1fr 48px;gap:10px;align-items:center}
  .bar-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:#5d564a}
  .bar-track{height:12px;background:rgba(20,24,31,.08);border-radius:1px;overflow:hidden}
  .bar-fill{height:100%;width:0;background:#9b9483;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .bar-row.top .bar-fill{background:var(--verm)}
  .bar-row.top .bar-label{color:var(--verm);font-weight:500}
  .bar-val{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5d564a;text-align:right}

  .stamp{display:none;margin-top:14px;padding:10px 13px;border:1px dashed var(--verm);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--verm);background:var(--verm-soft)}
  .stamp.show{display:block}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
      <span id="latStamp" class="readout ok" style="display:none"></span>
    <div class="panel-body">
      <div class="cr-cards" id="crCards"></div>
      <div class="tok-stream" id="tokStream" aria-live="polite"></div>
      <div class="bars" id="bars"></div>
      <div class="stamp" id="stamp"></div>
    </div>
  </div>
</div>
<script>
(function(){
  const CODES=[['EQR','Equipment reliability'],['PRD','Process deviation'],['CSF','Conventional safety'],['RDC','Radiological control'],['HKP','Housekeeping']];
  const CRS=[
    {id:'CR-26-04117',text:'Intermittent vibration noted on transfer pump P-203 during HAL transfer. Pump isolated and tagged out pending inspection of drive coupling.',probs:{EQR:.84,PRD:.07,CSF:.04,RDC:.03,HKP:.02}},
    {id:'CR-26-04203',text:'Step ladder found obstructing the emergency egress route. Removed and returned to designated storage.',probs:{CSF:.78,HKP:.16,EQR:.02,PRD:.02,RDC:.02}},
    {id:'CR-26-04288',text:'Line feed rate drifted above setpoint for approx. 12 minutes before operator correction. No product quality impact identified.',probs:{PRD:.81,EQR:.11,CSF:.04,RDC:.02,HKP:.02}}
  ];

  const cards=document.getElementById('crCards');
  const stream=document.getElementById('tokStream');
  const bars=document.getElementById('bars');
  const stamp=document.getElementById('stamp');
  const lat=document.getElementById('latStamp');

  CODES.forEach(([code,label])=>{
    const row=document.createElement('div');
    row.className='bar-row';row.dataset.code=code;
    row.innerHTML=`<span class="bar-label">${code} · ${label}</span><span class="bar-track"><span class="bar-fill"></span></span><span class="bar-val">—</span>`;
    bars.appendChild(row);
  });

  function tokenize(s){
    const out=[];
    s.split(/(\s+)/).forEach(w=>{
      if(/^\s+$/.test(w)||w==='') return;
      if(w.length<=6){out.push(w);}
      else{for(let i=0;i<w.length;i+=4)out.push((i?'·':'')+w.slice(i,i+4));}
    });
    return out;
  }

  let timer=null;
  function run(cr,btn){
    [...cards.children].forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
    if(timer)clearInterval(timer);
    stream.innerHTML='';stamp.classList.remove('show');lat.style.display='none';
    [...bars.children].forEach(r=>{r.classList.remove('top');r.querySelector('.bar-fill').style.width='0';r.querySelector('.bar-val').textContent='—';});

    const toks=tokenize(cr.text);
    toks.forEach(t=>{const el=document.createElement('span');el.className='tok';el.textContent=t;stream.appendChild(el);});
    const els=[...stream.children];
    let i=0;
    timer=setInterval(()=>{
      if(i<els.length){els[i++].classList.add('in');}
      else{
        clearInterval(timer);
        let top=null,topP=0;
        [...bars.children].forEach(r=>{
          const p=cr.probs[r.dataset.code]??0;
          r.querySelector('.bar-fill').style.width=(p*100)+'%';
          r.querySelector('.bar-val').textContent=p.toFixed(2);
          if(p>topP){topP=p;top=r;}
        });
        setTimeout(()=>{
          top.classList.add('top');
          const [code,label]=CODES.find(c=>c[0]===top.dataset.code);
        },700);
      }
    },36);
  }

  CRS.forEach(cr=>{
    const b=document.createElement('button');
    b.className='cr-card';
    b.innerHTML=`<span class="cid">${cr.id}</span>${cr.text}`;
    b.addEventListener('click',()=>run(cr,b));
    cards.appendChild(b);
  });
})();
</script>
</body>
</html>
