<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Spark</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000000}
  canvas{display:block;width:100%;height:100%}
  .label{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:rgba(140,146,162,.6);white-space:nowrap;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="label">Simple Rolling Window Averages Example</div>
<script>
(function(){
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  let w, h, t = 0;
  function size(){
    w = c.width  = window.innerWidth  * devicePixelRatio;
    h = c.height = window.innerHeight * devicePixelRatio;
  }
  size();
  addEventListener('resize', size);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(){
    ctx.clearRect(0,0,w,h);

    // subtle grid
    ctx.strokeStyle = 'rgba(86,128,141,.07)';
    ctx.lineWidth = 1;
    for(let gx=0; gx<w; gx+=40*devicePixelRatio){
      ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke();
    }
    for(let gy=0; gy<h; gy+=30*devicePixelRatio){
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke();
    }

    // signal trace (blue)
    ctx.strokeStyle = 'rgba(86,128,141,.75)';
    ctx.lineWidth = 2 * devicePixelRatio;
    ctx.beginPath();
    for(let x=0; x<=w; x+=3){
      const u = x/w;
      const y = h*0.5 + Math.sin(u*9+t)*h*0.22 + Math.sin(u*23+t*1.7)*h*0.08;
      x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();

    // prediction trace (vermillion, dashed)
    ctx.strokeStyle = 'rgba(224,81,29,.7)';
    ctx.lineWidth = 1.6 * devicePixelRatio;
    ctx.setLineDash([7*devicePixelRatio, 6*devicePixelRatio]);
    ctx.beginPath();
    for(let x=0; x<=w; x+=3){
      const u = x/w;
      const y = h*0.5 + Math.sin(u*9+t+0.25)*h*0.22 + Math.sin(u*23+t*1.7+0.4)*h*0.08;
      x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    t += 0.012;
    if(!reduced) requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
